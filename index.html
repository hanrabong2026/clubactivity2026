
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사회적 경제 기업 AI 피드백</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f7fb;
      font-family: "Pretendard", "Malgun Gothic", sans-serif;
      color: #202938;
    }

    .container {
      width: 90%;
      max-width: 480px;
      padding: 48px 30px;
      background: white;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,0.06);
    }

    .icon {
      font-size: 48px;
      margin-bottom: 18px;
    }

    h1 {
      font-size: 25px;
      margin: 0 0 18px;
      line-height: 1.5;
    }

    p {
      font-size: 15px;
      color: #64748b;
      line-height: 1.8;
      margin-bottom: 30px;
    }

    button {
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 12px;
      background: #3659e3;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #2847c2;
    }

    button:active {
      transform: scale(0.98);
    }

    .message {
      min-height: 24px;
      margin-top: 20px;
      color: #16803c;
      font-size: 14px;
      font-weight: 600;
    }

    .guide {
      margin-top: 16px;
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.7;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="icon">🏢</div>

    <h1>사회적 경제 기업<br>AI 피드백</h1>

    <p>
      우리가 만든 사회적 경제 기업을<br>
      AI에게 평가받아 봅시다.<br><br>
      아래 버튼을 눌러 프롬프트를 복사하세요.
    </p>

    <button onclick="copyPrompt()">
      📋 AI 평가 프롬프트 복사하기
    </button>

    <div class="message" id="message" role="status" aria-live="polite"></div>

    <div class="guide">
      ① 프롬프트 복사<br>
      ② AI 채팅창에 붙여넣기<br>
      ③ 자신의 창업 계획 업로드하기
    </div>

  </div>

  <script>
    const prompt = `우리는 고등학교 동아리 시간에 사회적 경제 기업 창업 프로젝트를 진행하고 있습니다.
우리 기업의 창업 계획을 읽고 다음 기준에 따라 객관적이고 구체적으로 평가해 주세요.

**평가 기준**
1. 사회적 가치: 해결하려는 사회 문제가 명확하고 해결 방법이 적절한가?
2. 경제적 지속 가능성: 수익을 창출하고 기업을 지속적으로 운영할 수 있는가?
3. 실현 가능성: 상품이나 서비스를 실제로 제공할 수 있는가?
4. 차별성: 기존 기업이나 서비스와 구별되는 특징이 있는가?

**피드백 형식**
① 우리 기업의 장점 2가지
② 우리 기업의 한계 및 문제점 2가지
③ 기업 운영을 통해 기대되는 사회적 효과 2가지
④ 가장 우선적으로 개선해야 할 문제와 구체적인 해결 방안

**주의사항**
- 단순한 칭찬보다는 실제 창업에 도움이 되는 피드백을 제공해 주세요.
- 고등학생이 이해할 수 있는 수준으로 설명해 주세요.
- 막연한 지적보다는 구체적인 이유와 사례를 제시해 주세요.
- 창업 계획에 없는 내용을 임의로 만들어 평가하지 마세요.

다음은 우리 기업의 창업 계획입니다.
[자신의 창업 계획 정리해서 업로드 하기]`;

    async function copyPrompt() {
      const message = document.getElementById("message");

      try {
        await navigator.clipboard.writeText(prompt);
        message.textContent = "✓ 프롬프트가 복사되었습니다!";
      } catch (error) {
        // 클립보드 API를 사용할 수 없는 환경을 위한 대체 방법
        const textarea = document.createElement("textarea");
        textarea.value = prompt;
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";
        document.body.appendChild(textarea);
        textarea.select();

        try {
          const copied = document.execCommand("copy");
          if (!copied) throw new Error("복사 실패");
          message.textContent = "✓ 프롬프트가 복사되었습니다!";
        } catch (fallbackError) {
          message.textContent = "복사에 실패했습니다. 브라우저 설정을 확인해 주세요.";
        } finally {
          textarea.remove();
        }
      }
    }
  </script>

</body>
</html>
