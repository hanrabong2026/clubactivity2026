
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사회적 경제 기업 AI 피드백</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f7fb;
      font-family: "Pretendard", "Malgun Gothic", sans-serif;
      color: #202938;
    }

    .container {
      width: 90%;
      max-width: 480px;
      padding: 48px 30px;
      background: white;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,0.06);
    }

    .icon {
      font-size: 48px;
      margin-bottom: 18px;
    }

    h1 {
      font-size: 25px;
      margin: 0 0 18px;
      line-height: 1.5;
    }

    p {
      font-size: 15px;
      color: #64748b;
      line-height: 1.8;
      margin-bottom: 30px;
    }

    button {
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 12px;
      background: #3659e3;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #2847c2;
    }

    button:active {
      transform: scale(0.98);
    }

    .message {
      min-height: 24px;
      margin-top: 20px;
      color: #16803c;
      font-size: 14px;
      font-weight: 600;
    }

    .guide {
      margin-top: 16px;
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.7;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="icon">🏢</div>

    <h1>사회적 경제 기업<br>AI 피드백</h1>

    <p>
      우리가 만든 사회적 경제 기업을<br>
      AI에게 객관적으로 평가받아 봅시다.<br><br>
      아래 버튼을 눌러 프롬프트를 복사하세요.
    </p>

    <button onclick="copyPrompt()">
      📋 AI 평가 프롬프트 복사하기
    </button>

    <div class="message"
         id="message"
         role="status"
         aria-live="polite"></div>

    <div class="guide">
      ① 프롬프트 복사<br>
      ② AI 채팅창에 붙여넣기<br>
      ③ 자신의 창업 계획 업로드하기
    </div>

  </div>

  <script>
    const prompt = `우리는 고등학교 동아리 시간에 사회적 경제 기업 창업 프로젝트를 진행하고 있습니다.

우리 기업의 창업 계획을 읽고 다음 기준에 따라 객관적이고 구체적으로 평가해 주세요.

**평가 기준**

1. 경영 및 사업의 실현 가능성
- 기업의 경영 방식과 상품 및 서비스 제공이 현실적으로 가능한가?
- 기업을 안정적으로 운영하면서 상품 및 서비스의 품질을 지속적으로 유지하고 향상할 수 있는가?

2. 사회적 가치 실현의 실효성
- 기업이 제공하는 상품이나 서비스가 해결하려는 사회 문제의 원인에 적절하게 대응하는가?
- 기업의 활동을 통해 사회적 목적을 실제로 달성할 수 있는가?

3. 수익 구조 및 경제적 지속 가능성
- 기업의 수익 창출 방식이 구체적이고 현실적인가?
- 운영 비용을 감당하면서 사회적 목적을 지속적으로 추구할 수 있는 안정적인 수익 구조를 갖추고 있는가?

4. 홍보 전략 및 사회적 가치 확산
- 기업의 홍보 방식이 주요 고객에게 효과적으로 접근할 수 있는가?
- 홍보 활동이 소비자들의 관심과 참여를 유도하고 기업이 추구하는 사회적 가치를 확산하는 데 기여할 수 있는가?

5. 차별성 및 경쟁력
- 기존 기업이나 유사한 상품 및 서비스와 비교했을 때 차별화된 특징이 있는가?
- 이러한 차별성이 소비자의 선택을 이끌어 낼 수 있는가?

**피드백 형식**

① 우리 기업의 장점 2가지
- 평가 기준을 바탕으로 기업의 강점을 구체적으로 설명해 주세요.

② 우리 기업의 한계 및 문제점 2가지
- 실제 기업 운영 과정에서 발생할 수 있는 문제와 그 이유를 설명해 주세요.

③ 기업 운영을 통해 기대되는 사회적 효과 2가지
- 기업의 활동이 사회 문제 해결과 사회적 가치 실현에 어떤 변화를 가져올 수 있는지 설명해 주세요.

④ 가장 우선적으로 개선해야 할 문제와 구체적인 해결 방안
- 개선이 시급한 문제를 선정하고, 실제로 적용할 수 있는 해결 방안을 제시해 주세요.

**주의사항**

- 단순한 칭찬보다는 실제 창업에 도움이 되는 객관적이고 비판적인 피드백을 제공해 주세요.
- 고등학생이 이해할 수 있는 수준으로 설명해 주세요.
- 막연한 지적보다는 구체적인 이유와 사례를 제시해 주세요.
- 창업 계획에 없는 내용을 임의로 만들어 평가하지 마세요.
- 평가에 필요한 정보가 부족하다면 해당 내용을 명확하게 지적하고, 추가로 검토해야 할 사항을 알려 주세요.
- 사회적 가치 실현과 경제적 지속 가능성을 균형 있게 평가해 주세요.
- 실현 가능성이 낮거나 현실성이 부족한 부분은 무조건 긍정적으로 평가하지 말고, 그 이유와 예상되는 문제를 명확하게 지적해 주세요.
- 개선 방안은 학생들이 실제 사업 계획에 반영할 수 있도록 구체적이고 실천 가능한 수준으로 제시해 주세요.

다음은 우리 기업의 창업 계획입니다.

[자신의 창업 계획 정리해서 업로드 하기]`;

    async function copyPrompt() {
      const message = document.getElementById("message");

      try {
        await navigator.clipboard.writeText(prompt);
        message.textContent = "✓ 프롬프트가 복사되었습니다!";
      } catch (error) {
        const textarea = document.createElement("textarea");
        textarea.value = prompt;
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";
        document.body.appendChild(textarea);
        textarea.select();

        try {
          const copied = document.execCommand("copy");

          if (!copied) {
            throw new Error("복사 실패");
          }

          message.textContent = "✓ 프롬프트가 복사되었습니다!";
        } catch (fallbackError) {
          message.textContent =
            "복사에 실패했습니다. 브라우저 설정을 확인해 주세요.";
        } finally {
          textarea.remove();
        }
      }
    }
  </script>

</body>
</html>
